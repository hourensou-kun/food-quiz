<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>やさいクイズ！</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- タイトル画面 -->
    <section id="title-screen" class="screen active">
      <h1>やさいクイズ！</h1>
      <button id="start-btn">スタート</button>
    </section>

    <!-- ゲーム選択画面 -->
    <section id="select-screen" class="screen">
      <h2>どのクイズであそぶ？</h2>
      <button id="quiz-shape-btn">① やさいをきったらどんなかたち？</button>
      <button id="quiz-sound-btn" disabled>② やさいをきったらどんなおと？（準備中）</button>
    </section>

    <!-- 問題画面 -->
    <section id="quiz-screen" class="screen">
    <img id="question-image" src="" alt="クイズ画像" />
      <h2 id="question-text"></h2>
       <h2>この食べものをきったら、どんなもようがみえるかな？えらんでみよう！</h2>
      <div id="choices"></div>
    </section>

    <!-- ✅ 答えあわせ動画画面 -->
    <section id="answer-screen" class="screen">
      <h2>こたえあわせだよ！こんなもようがみえるね！</h2>
      <div id="feedback-area"></div>
      <video id="answer-video" muted autoplay playsinline controls></video>
      <button id="next-btn">つぎのもんだいへ ▶️</button>
    </section>

    <!-- リザルト画面 -->
    <section id="end-screen" class="screen">
      <h2>けっかはっぴょう</h2>
      <p id="score-text"></p>
      <button id="restart-btn">はじめにもどる</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
