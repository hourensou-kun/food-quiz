<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>やさいクイズ！</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 簡易スタイル（スマホ縦長想定） */
    body { font-family: sans-serif; margin:0; background:#f7fff2; color:#222; }
    .screen { display:none; padding:18px; min-height:100vh; box-sizing:border-box; text-align:center; }
    .screen.active { display:block; }
    h1,h2 { margin:12px 0; }
    #question-image { width:80%; max-width:360px; border-radius:12px; display:block; margin:8px auto; }
    .choices { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .choice-item { width:30%; min-width:90px; text-align:center; }
    .choice-item img { width:100%; aspect-ratio:1 / 1; object-fit:cover; border-radius:10px; }
    button { font-size:18px; padding:10px 16px; border-radius:10px; border:none; background:#4CAF50; color:white; }
    #answer-video { width:100%; max-width:420px; border-radius:12px; background:#000; }
    .feedback { font-size:48px; margin-top:30px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- タイトル -->
    <section id="title-screen" class="screen active">
      <h1>やさいクイズ！</h1>
      <button id="start-btn">スタート</button>
    </section>

    <!-- クイズ選択 -->
    <section id="select-screen" class="screen">
      <h2>どのクイズであそぶ？</h2>
      <button id="quiz-shape-btn">① かたちクイズ（写真 → 画像選択）</button>
      <button id="quiz-sound-btn" disabled>② おとクイズ（準備中）</button>
    </section>

    <!-- 問題画面 -->
    <section id="quiz-screen" class="screen">
      <h2 id="question-text"></h2>
      <img id="question-image" src="" alt="問題画像" />
      <div id="choices" class="choices"></div>
    </section>

    <!-- 答えあわせ（動画再生） -->
    <section id="answer-screen" class="screen">
      <div id="feedback-area" class="feedback" aria-live="polite"></div>
      <div id="video-wrap" style="margin-top:14px;">
        <video id="answer-video" playsinline muted controls></video>
      </div>
      <div style="margin-top:12px;">
        <button id="next-btn">つぎのもんだいへ</button>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="end-screen" class="screen">
      <h2>おつかれさま！</h2>
      <p id="score-text"></p>
      <button id="restart-btn">もういちどあそぶ</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
