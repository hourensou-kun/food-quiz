<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>やさいクイズ！</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 <div id="app">

  <!-- 🔰 0. 注意書き画面（NEW） -->
  <section id="notice-screen" class="screen active">
    <h2>このゲームであそぶまえに</h2>
    <p>おうちのひとと いっしょにあそんでね。</p>
    <p>おとがでるので、<br>ボリュームにきをつけてね。</p>
    <button id="notice-ok-btn">つぎへ ▶️</button>
  </section>

  <!-- ① タイトル画面（active を外す！） -->
  <section id="title-screen" class="screen">
    <h1>やさいクイズ！</h1>
    <button id="start-btn">スタート</button>
    <h2>保護者の方へ</h2>
    <h3>このゲームでは動画を使用しています。音量にお気をつけてプレイしてください。</h3>
  </section>

  <!-- ② ゲーム選択画面 -->
  <section id="select-screen" class="screen">
    <h2>どのクイズであそぶ？</h2>
    <button id="quiz-shape-btn">やさいをきったらどんなかたち？</button>
    <button id="quiz-sound-btn" disabled>やさいをきったらどんなおと？</button>
  </section>

  <!-- ③ 問題画面 -->
  <section id="quiz-screen" class="screen">
    <h2 id="question-text"></h2>

    <div class="media-frame">
      <img id="question-image" src="" alt="クイズ画像" />
    </div>

    <div id="choices"></div>
  </section>

  <!-- ④ 正誤判定画面 -->
  <section id="judge-screen" class="screen">
    <h2 id="judge-text"></h2>
  </section>

  <!-- ⑤ 答えあわせ動画画面 -->
  <section id="answer-screen" class="screen">
    <h2>こたえあわせ！</h2>
    <video id="answer-video" autoplay playsinline controls></video>
    <button id="next-btn">つぎのもんだいへ ▶️</button>
  </section>

  <!-- ⑥ リザルト画面 -->
  <section id="end-screen" class="screen">
    <h2>がんばったね！</h2>
    <p id="score-text"></p>
    <button id="restart-btn">はじめにもどる</button>
  </section>

</div>

  </div> <!-- #app の閉じタグのすぐ後ろに追加 -->

  <!-- 🎵 効果音 & BGM -->
  <audio id="se-correct" src="music/Quiz-Ding_Dong05-4(Slow-Short).mp3" preload="auto"></audio>
  <audio id="se-wrong"   src="music/Short_Accent10-1(Low).mp3"        preload="auto"></audio>
  <audio id="bgm"        src="music/Tekuteku_Aruko-1(Marimba).mp3"    preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
